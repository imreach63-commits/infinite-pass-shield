name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App APK
        run: |
          npm install -g @gonative/cli || true
          mkdir -p output
          zip -r output/website.zip index.html

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: App-Files-Ready
          path: index.html
